<ion-header>
  <ion-toolbar>
    <ion-title>Acceso</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment [(ngModel)]="mode">
      <ion-segment-button value="login">
        <ion-label>Login</ion-label>
      </ion-segment-button>
      <ion-segment-button value="register">
        <ion-label>Registro</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-form">
    <ion-input
      #userInput
      class="auth-input"
      label="Usuario"
      labelPlacement="stacked"
      [(ngModel)]="username"
      autocomplete="username"
      inputmode="text"
    ></ion-input>

    <ion-input
      #passInput
      class="auth-input"
      label="Contraseña"
      labelPlacement="stacked"
      [(ngModel)]="password"
      type="password"
      autocomplete="current-password"
    ></ion-input>

    <ion-input
      *ngIf="mode === 'register'"
      class="auth-input"
      label="Confirmar contraseña"
      labelPlacement="stacked"
      [(ngModel)]="confirm"
      type="password"
      autocomplete="new-password"
    ></ion-input>

    <ion-button expand="block" [disabled]="loading" (click)="submit()">
      <ion-spinner slot="start" *ngIf="loading"></ion-spinner>
      {{ mode === 'login' ? 'Entrar' : 'Crear usuario' }}
    </ion-button>
  </div>
</ion-content>
