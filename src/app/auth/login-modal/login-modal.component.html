<ion-header>
  <ion-toolbar>
    <ion-title>Acceso</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <ion-segment [(ngModel)]="mode">
      <ion-segment-button value="login">
        <ion-label>Login</ion-label>
      </ion-segment-button>
      <ion-segment-button value="register">
        <ion-label>Registro</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
 
 <form class="auth-form">
  <div class="field">
    <label>Usuario</label>
    <input
      class="native-field"
      type="text"
      name="username"
      [(ngModel)]="username"
      autocomplete="username"
      required
    />
  </div>

  <div class="field">
    <label>Contraseña</label>
    <input
      class="native-field"
      type="password"
      name="password"
      [(ngModel)]="password"
      autocomplete="current-password"
      required
    />
  </div>

  <div class="field" *ngIf="mode === 'register'">
    <label>Confirmar contraseña</label>
    <input
      class="native-field"
      type="password"
      name="confirm"
      [(ngModel)]="confirm"
      autocomplete="new-password"
      required
    />
  </div>

  <ion-button expand="block" (click)="submit()" [disabled]="loading">
    <ion-spinner slot="start" *ngIf="loading"></ion-spinner>
    {{ mode === 'login' ? 'Entrar' : 'Crear usuario' }}
  </ion-button>
</form>
</ion-content>
