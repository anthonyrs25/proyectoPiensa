<ion-content class="ion-padding">
  <div class="auth-form">
    <ion-input
      class="auth-input"
      label="Usuario"
      labelPlacement="stacked"
      [(ngModel)]="username"
      autocomplete="username"
      inputmode="text"
    ></ion-input>

    <ion-input
      class="auth-input"
      label="Contraseña"
      labelPlacement="stacked"
      [(ngModel)]="password"
      type="password"
      autocomplete="current-password"
    ></ion-input>

    <ion-input
      *ngIf="mode === 'register'"
      class="auth-input"
      label="Confirmar contraseña"
      labelPlacement="stacked"
      [(ngModel)]="confirm"
      type="password"
      autocomplete="new-password"
    ></ion-input>

    <ion-button expand="block" [disabled]="loading" (click)="submit()">
      <ion-spinner slot="start" *ngIf="loading"></ion-spinner>
      {{ mode === 'login' ? 'Entrar' : 'Crear usuario' }}
    </ion-button>

    <ion-text color="medium">
      <p style="text-align:center; margin-top:12px;">
        Demo: credenciales se guardan en el navegador (localStorage)
      </p>
    </ion-text>
  </div>
</ion-content>
