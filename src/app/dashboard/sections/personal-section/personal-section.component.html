<div class="header">
  <div>
    <h3>Personal</h3>
    <p>Registra / Genera Proformas y OT</p>
  </div>
  <ion-searchbar [(ngModel)]="q" placeholder="Buscar personal..."></ion-searchbar>
</div>

<div class="grid">
  <div class="panel">
    <h4>{{ editingCedula ? 'Editar personal' : 'Nuevo personal' }}</h4>

    <ion-item>
      <ion-input label="Cédula" labelPlacement="stacked" [(ngModel)]="cedula"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Nombre" labelPlacement="stacked" [(ngModel)]="nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Apellido" labelPlacement="stacked" [(ngModel)]="apellido"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Celular" labelPlacement="stacked" [(ngModel)]="celular"></ion-input>
    </ion-item>

    <ion-item>
      <ion-select label="Rol" labelPlacement="stacked" [(ngModel)]="rol">
        <ion-select-option value="ADMIN">ADMIN</ion-select-option>
        <ion-select-option value="RECEPCION">RECEPCION</ion-select-option>
        <ion-select-option value="TECNICO">TECNICO</ion-select-option>
      </ion-select>
    </ion-item>

    <div class="row">
      <button class="btn" (click)="save()">Guardar</button>
      <button class="btn ghost" (click)="reset()">Limpiar</button>
    </div>
  </div>

  <div class="panel">
    <h4>Listado</h4>

    <div class="table">
      <div class="thead">
        <div>Cédula</div>
        <div>Nombre</div>
        <div>Rol</div>
        <div>Acciones</div>
      </div>

      <div class="trow" *ngFor="let p of filtered">
        <div class="strong">{{ p.cedula }}</div>
        <div>
          <div class="strong">{{ p.nombre }} {{ p.apellido }}</div>
          <div class="muted">{{ p.celular }}</div>
        </div>
        <div class="muted">{{ p.rol }}</div>
        <div class="actions">
          <button class="mini" (click)="edit(p)">Editar</button>
          <button class="mini danger" (click)="remove(p.cedula)">Eliminar</button>
        </div>
      </div>
    </div>

  </div>
</div>
