<ion-header class="ms-header" [translucent]="true">
  <ion-toolbar class="ms-toolbar">

    <ion-buttons slot="start" class="ms-left">
      <ion-button fill="clear" class="left" (click)="scrollTop()">
        <img class="left-logo" src="assets/logo.png" alt="LOGO" />
        <span class="left-name">MOTRISERVICE</span>
      </ion-button>
    </ion-buttons>

    <section class="ms-center">
      <ion-buttons class="ms-nav">
        <ion-button fill="clear" (click)="scrollTo('sobre')">Sobre Nosotros</ion-button>
        <ion-button fill="clear" (click)="scrollTo('servicios')">Servicios</ion-button>
        <ion-button fill="clear" (click)="scrollTo('contacto')">Contacto</ion-button>
      </ion-buttons>
    </section>

    <ion-buttons slot="end" class="ms-right">
      <ion-button fill="clear" class="chip" (click)="openThemeModal()">
        <ion-icon name="contrast-outline" slot="start"></ion-icon>
        <span class="label">Tema</span>
      </ion-button>
      <ion-button fill="clear" class="chip" (click)="openLanguageModal()">
        <ion-icon name="language-outline" slot="start"></ion-icon>
        <span class="label">Idioma</span>
      </ion-button>
      <ion-button fill="solid" class="login" (click)="openLoginModal()">
        <ion-icon name="person-circle-outline" slot="start"></ion-icon>
        <span class="label">Iniciar Sesión</span>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content #pageContent [fullscreen]="true">
  <section id="video-container">
    <video #bgVideo muted autoplay loop playsinline webkit-playsinline preload="auto">
      <source src="assets/video.mp4" type="video/mp4" />
    </video>
  </section>
  <section id="sobre">
    <h2>Sobre Nosotros</h2>
  </section>
  <section id="servicios">
    <h2>Servicios</h2>
  </section>
  <section id="contacto">
    <h2>Contacto</h2>
  </section>
</ion-content>

<ion-footer>

</ion-footer>
