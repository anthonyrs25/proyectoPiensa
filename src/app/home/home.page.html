<ion-header class= "ms-header" [translucent]="true">
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-button fill="clear" class="brand" (click)="scrollTo('inicio')">
      <img class="brand__logo" src="assets/logo.png" alt="MOTRISERVICE LOGO"/>
      <span class="brand__name">MOTRISERVICE</span>
      </ion-button>
    </ion-buttons>

    <div class="nav-center">
      <ion-buttons>
        <ion-button fill="clear" (click)="scrollTo('sobre')">Sobre Nosotros</ion-button>
        <ion-button fill="clear" (click)="scrollTo('servicios')">Servicios</ion-button>
        <ion-button fill="clear" (click)="scrollTo('contacto')">Contacto</ion-button>
      </ion-buttons>
    </div>

    <ion-buttons slot="end" class="actions">
      <ion-button fill="clear" (click)="openThemeModal()">
        <ion-icon name="contrast-outline" slot="start"></ion-icon>
        <span class="label">Tema</span>
      </ion-button>
      <ion-button fill="clear" (click)="openLanguageModal()">
        <ion-icon name="language-outline" slot="start"></ion-icon>
        <span class="label">Idioma</span>
      </ion-button>
      <ion-button fill="solid" class="login" (click)="openLoginModal()">
        <ion-icon name="person-circle-outline" slot="start"></ion-icon>
        <span class="label">Iniciar Sesión</span>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <section id="video-container">
    <video autoplay muted loop playsinline webkit-playsinline preload="auto" (loadedmetadata)="onVideoReady($event)">
      <source src="assets/video.mp4" type="video/mp4">
    </video>
  </section>
  <section id="inicio">
    <h2>Inicio</h2>
  </section>
  <section id="sobre">
    <h2>Sobre Nosotros</h2>
  </section>
  <section id="servicios">
    <h2>Servicios</h2>
  </section>
  <section id="contacto">
    <h2>Contacto</h2>
  </section>
</ion-content>

<ion-footer>

</ion-footer>
